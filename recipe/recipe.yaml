# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 0.66b0

package:
  name: opentelemetry-instrumentation-tortoiseorm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-tortoiseorm/opentelemetry_instrumentation_tortoiseorm-${{ version }}.tar.gz
  sha256: fd79ed1eed027059018532d82226c6d0361125d6855cbba333ea16d2e63911da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.12,<2.dev0
    - opentelemetry-instrumentation ==${{ version }}
    - opentelemetry-semantic-conventions ==${{ version }}
    - opentelemetry-semantic-conventions ==0.66b0
    - opentelemetry-instrumentation ==0.66b0
tests:
  - python:
      imports:
        - opentelemetry
        - opentelemetry.instrumentation.tortoiseorm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-tortoiseorm
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenTelemetry Instrumentation for Tortoise ORM
  description: |
    OpenTelemetry Instrumentation for Tortoise ORM
  repository: https://github.com/open-telemetry/opentelemetry-python-contrib

extra:
  recipe-maintainers:
    - rxm7706
    - conda-forge/opentelemetry-api
